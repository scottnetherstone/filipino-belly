<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Not Completed | The Filipino Belly</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --red: #D42E12;
  --blue: #0047AB;
  --gold: #F5B731;
  --dark: #0D0D0D;
  --text-light: #F0EBE3;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--dark);
  color: var(--text-light);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  text-align: center;
}
.content { max-width: 500px; }
.icon {
  width: 70px;
  height: 70px;
  margin: 0 auto 1.5rem;
  border-radius: 50%;
  background: rgba(212,46,18,0.15);
  border: 3px solid var(--red);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  color: var(--red);
  font-family: 'Bebas Neue', sans-serif;
}
h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(2rem, 5vw, 3rem);
  letter-spacing: 0.06em;
  margin-bottom: 0.5rem;
}
p {
  color: #bbb;
  line-height: 1.6;
  margin-bottom: 2rem;
  font-size: 1rem;
}
.cta-row {
  display: flex;
  gap: 1rem;
  justify-content: center;
  flex-wrap: wrap;
}
.btn {
  display: inline-block;
  padding: 0.85rem 1.8rem;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.05rem;
  letter-spacing: 0.1em;
  text-decoration: none;
  border: 2px solid transparent;
  transition: all 0.3s;
}
.btn-primary { background: var(--red); color: white; border-color: var(--red); }
.btn-primary:hover { background: #B82510; }
.btn-outline { background: transparent; color: var(--gold); border-color: var(--gold); }
.btn-outline:hover { background: var(--gold); color: var(--dark); }
.flag-stripe {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--blue) 33%, var(--gold) 33% 66%, var(--red) 66%);
}
</style>
</head>
<body>
<div class="content">
  <div class="icon">!</div>
  <h1>Order Not Completed</h1>
  <p>No worries — no charges were made. Your cart is still saved if you'd like to try again.</p>
  <div class="cta-row">
    <a href="/order" class="btn btn-primary">Return to Cart</a>
    <a href="/" class="btn btn-outline">Back to Site</a>
  </div>
</div>
<div class="flag-stripe"></div>
</body>
</html>
